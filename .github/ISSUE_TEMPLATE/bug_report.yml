name: Bug report
description: Something isn't working as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing issues first.
        **Security vulnerabilities must not be reported here.** See the
        [security policy](https://github.com/Alteriom/.github/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, code or configuration that shows the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, package version or commit you're using.
      placeholder: e.g. v2.1.1, 0.8.0, or a commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        For firmware: board, chip family and framework/core version.
        For software: OS, runtime (Node.js / Python) version.
      placeholder: |
        Board: ESP32-S3 DevKitC-1
        Framework: Arduino core 3.0.x via PlatformIO
        OS: Ubuntu 24.04
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or serial output
      description: Paste any relevant output. It's formatted as code automatically.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
        - label: I can reproduce this on the latest release.
          required: false
